# http-context only. Source proposal; worker/socket permissions need Stage E review.
upstream hms_private_static { server unix:/opt/hms/run/edge-static.sock; }
map "$http_if_modified_since$http_if_none_match$http_if_unmodified_since$http_if_match$http_if_range" $hms_static_conditional {
    "" 0;
    default 1;
}
map "$http_cookie$http_authorization$http_x_hms_network_probe" $hms_static_authority {
    "" 0;
    default 1;
}
map $http_range $hms_static_range { "" 0; default 1; }
log_format hms_static_boundary 'conditional=$hms_static_conditional authority=$hms_static_authority range=$hms_static_range';
server {
    listen unix:/opt/hms/run/edge-static.sock;
    server_name hms.praritsidana.com;
    server_tokens off;
    root /opt/hms/static;
    index index.html;
    auth_request off;
    auth_basic off;
    satisfy all;
    autoindex off;
    disable_symlinks on;
    etag off;
    if_modified_since off;
    absolute_redirect off;
    access_log /opt/hms/logs/static-boundary.log hms_static_boundary;
    location ~ /\. { deny all; }
    location = /_hms_network_check { return 404; }
    location ^~ /api/ { return 404; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
