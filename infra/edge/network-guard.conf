# Include at protected TLS server context alongside the security add_header set.
# Requires ngx_http_auth_request_module. Source only: deployment is separate.
auth_request /_hms_network_check;
satisfy all;
add_header Cache-Control "no-store" always;
etag off;
if_modified_since off;

# Exact external blocker; the internal location proxies directly to the backend.
location = /api/v1/network-policy/edge-probe/ { return 404; }

location = /_hms_network_check {
    internal;
    auth_request off;
    auth_basic off;
    satisfy all;
    proxy_pass http://127.0.0.1:8185/api/v1/network-policy/edge-probe/;
    proxy_http_version 1.1;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header Host hms.praritsidana.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-HMS-Network-Probe "1";
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_send_timeout 3s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_store off;
}
