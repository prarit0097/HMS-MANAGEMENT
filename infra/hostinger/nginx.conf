# Installed only for hms.praritsidana.com; nginx http-context include.
limit_req_zone $binary_remote_addr zone=hms_login:1m rate=5r/m;
log_format hms_safe '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name hms.praritsidana.com;
    location /.well-known/acme-challenge/ { root /opt/hms/acme; }
    location / { return 301 https://hms.praritsidana.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hms.praritsidana.com;
    ssl_certificate /etc/letsencrypt/live/hms.praritsidana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hms.praritsidana.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/hms/static;
    index index.html;
    client_max_body_size 64k;
    auth_basic "HMS private preview";
    auth_basic_user_file /opt/hms/secrets/preview.htpasswd;
    access_log /opt/hms/logs/access.log hms_safe;
    error_log /opt/hms/logs/error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /opt/hms/current/infra/edge/network-guard.conf;
    location ~ /\. { deny all; }
    location = /api/v1/auth/login/ {
        limit_req zone=hms_login burst=5 nodelay;
        limit_req_status 429;
        include /opt/hms/current/infra/hostinger/proxy.conf;
    }
    location /api/ { include /opt/hms/current/infra/hostinger/proxy.conf; }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
