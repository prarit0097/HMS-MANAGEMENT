# Container-private administration socket; no socket is mounted outside container.
local all all trust
hostnossl all all all reject
hostssl hms_preview hms_app all scram-sha-256
# Test DB is short-lived and separate; app role has CREATEDB only during checks.
hostssl test_hms_preview hms_app all scram-sha-256
# Django uses the empty maintenance DB to create/drop its isolated test DB.
hostssl postgres hms_app all scram-sha-256
host all all all reject
