      "NetworkPolicy": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "allowlist_only": {
            "type": "boolean"
          },
          "allowlist": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 64,
              "minLength": 1,
              "pattern": "^[\\x09\\x20-\\x7e]{1,64}$"
            },
            "maxItems": 100
          },
          "blocklist": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 64,
              "minLength": 1,
              "pattern": "^[\\x09\\x20-\\x7e]{1,64}$"
            },
            "maxItems": 100
          }
        },
        "required": [
          "allowlist_only",
          "allowlist",
          "blocklist"
        ],
        "description": "Strict JSON booleans and at most 200 total rules. Raw input is1..64 ASCII characters before trimming ASCII space/tab only; trimmed result must be nonempty. ASCII addresses/CIDRs only, no controls/zones/ports/hostnames/comments. Whitelist-only requires a nonempty allowlist. Canonical output emits /32 or /128 exact addresses and sorted deduplicated networks. Mapped IPv6 prefix >=96 maps to IPv4. Blocks win; environment AND time-selected overlay must both allow. Cross-field/parser semantics are enforced beyond schema. Exact IPs or CIDRs with one to three ASCII decimal prefix digits only; no dotted netmask/hostmask, signs or extra slashes. Leading zeroes normalise. Raw rule length is bounded before trimming SP/HT; trimmed value must be nonempty."
      },
