    "/platform/organisations/{organisation_id}/audit-events/": {
      "get": {
        "operationId": "listAdministrationHistory",
        "summary": "List scoped nonclinical administration changes",
        "description": "List scoped nonclinical administration changes. Read-only allowlisted projection, no raw stored JSON or clinical/global foreign events. Administration requires current MFA policy as well as scoped permission. Exact query/projection/privacy contract: audit-history-contract.md.",
        "x-permission": "platform.audit.read",
        "parameters": [
          {
            "name": "organisation_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            },
            "description": "Larger positive values clamp to100."
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "maximum": 10000,
              "default": 0
            },
            "description": ""
          },
          {
            "name": "after",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-][0-9]{2}:[0-9]{2})$",
              "maxLength": 32
            },
            "description": "Explicit timezone required; inclusive. Default before minus30days."
          },
          {
            "name": "before",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time",
              "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,6})?(?:Z|[+-][0-9]{2}:[0-9]{2})$",
